services:
  yumpi:
    image: ghcr.io/elvonpiko/yumpi:v0.2.1
    build:
      context: .
      network: host
    container_name: yumpi
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    volumes:
      - /etc/yumpi:/etc/yumpi
      - /var/lib/yumpi:/var/lib/yumpi
      - /run/yumpi:/run/yumpi
      - /usr/bin/mullvad:/usr/bin/mullvad:ro
      - /run/mullvad-vpn:/run/mullvad-vpn
      - /etc/mullvad-vpn:/etc/mullvad-vpn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
