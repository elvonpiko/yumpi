name: Make image public

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set the package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "packages visible to this token:"
          gh api "/repos/elvonpiko/yumpi/packages?package_type=container" --jq '.[] | {name,visibility,html_url}' || true
          gh api --method PATCH /repos/elvonpiko/yumpi/packages/container/yumpi -f visibility=public
          gh api /repos/elvonpiko/yumpi/packages/container/yumpi --jq '{name: .name, visibility: .visibility, url: .html_url}'
