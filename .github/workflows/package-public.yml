name: Make image public

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - name: Set the package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/yumpi -f visibility=public
          gh api /user/packages/container/yumpi --jq '{name: .name, visibility: .visibility, url: .html_url}'
